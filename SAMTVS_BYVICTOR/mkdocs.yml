site_name: SAMTVS BYVICTOR
site_description: Biblioteca Python para controlar Samsung Smart TVs com Tizen através da rede local.
site_author: Victor
site_url: https://github.com/LightPPR2/SAMTVS_BYVICTOR

repo_name: LightPPR2/SAMTVS_BYVICTOR
repo_url: https://github.com/LightPPR2/SAMTVS_BYVICTOR

theme:
  name: material
  language: pt-BR

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

nav:
  - Início: index.md
  - Instalação: installation.md
  - Quickstart: quickstart.md
  - API Reference: api.md
  - Exemplos: examples.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.details

plugins:
  - search